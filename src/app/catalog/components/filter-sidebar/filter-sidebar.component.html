
<aside class="sidebar">
    <div class="sidebar-header">
        <h2 class="sidebar-title">Filtros</h2>
        <button class="close-btn" (click)="toggleSidebar()">×</button>
    </div>

    <!-- Sección de Ordenamiento -->
    <div class="sort-section">
        <button class="sort-button" (click)="toggleSection('sort')">
            <span>Ordenar elementos</span>
            <div class="chevron" id="sort-chevron"></div>
        </button>
        <div class="sort-options" id="sort-options">
            <ul class="sort-list">
                <li class="sort-item">
                    <label class="radio-label">
                        <input type="radio" name="sort" value="price_asc" class="radio-input" (change)="onSortChange($event)">
                        <span class="radio-custom"></span>
                        <span class="radio-text">Precio: del más bajo al más alto</span>
                    </label>
                </li>
                <li class="sort-item">
                    <label class="radio-label">
                        <input type="radio" name="sort" value="price_desc" class="radio-input" (change)="onSortChange($event)">
                        <span class="radio-custom"></span>
                        <span class="radio-text">Precio: del más alto al más bajo</span>
                    </label>
                </li>
                <li class="sort-item">
                    <label class="radio-label">
                        <input type="radio" name="sort" value="date_desc" class="radio-input" checked (change)="onSortChange($event)">
                        <span class="radio-custom"></span>
                        <span class="radio-text">Fecha: más reciente</span>
                    </label>
                </li>
                <li class="sort-item">
                    <label class="radio-label">
                        <input type="radio" name="sort" value="date_asc" class="radio-input" (change)="onSortChange($event)">
                        <span class="radio-custom"></span>
                        <span class="radio-text">Fecha: más antiguo primero</span>
                    </label>
                </li>
                <li class="sort-item">
                    <label class="radio-label">
                        <input type="radio" name="sort" value="popularity" class="radio-input" (change)="onSortChange($event)">
                        <span class="radio-custom"></span>
                        <span class="radio-text">Popularidad: los más populares</span>
                    </label>
                </li>
                <li class="sort-item">
                    <label class="radio-label">
                        <input type="radio" name="sort" value="alpha_asc" class="radio-input" (change)="onSortChange($event)">
                        <span class="radio-custom"></span>
                        <span class="radio-text">Alfabeto: A-Z</span>
                    </label>
                </li>
                <li class="sort-item">
                    <label class="radio-label">
                        <input type="radio" name="sort" value="alpha_desc" class="radio-input" (change)="onSortChange($event)">
                        <span class="radio-custom"></span>
                        <span class="radio-text">Alfabeto: Z-A</span>
                    </label>
                </li>
            </ul>
        </div>
    </div>

    <!-- Sección de Precio -->
    <div class="filter-section">
        <button class="filter-button" (click)="toggleSection('price')">
            <span>Precio (MXN)</span>
            <div class="chevron" id="price-chevron"></div>
        </button>
        <div class="filter-content" id="price-content">
            <div class="price-inputs">
                <input type="number" class="price-input" placeholder="Mínimo" min="0" (input)="onPriceFilterChange($event, 'min')">
                <span class="price-separator">-</span>
                <input type="number" class="price-input" placeholder="Máximo" min="0" (input)="onPriceFilterChange($event, 'max')">
            </div>
        </div>
    </div>

    <!-- Sección de Tipo de Producto -->
    <div class="filter-section">
        <button class="filter-button" (click)="toggleSection('type')">
            <span>Tipo de producto</span>
            <div class="chevron" id="type-chevron"></div>
        </button>
        <div class="filter-content" id="type-content">
            <div class="search-box">
                <input type="text" class="search-input" placeholder="Buscar tipo...">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
            </div>
            <ul class="checkbox-list">
                <li class="checkbox-item">
                    <label class="checkbox-label">
                        <input type="checkbox" class="checkbox-input" value="juego" (change)="onTypeFilterChange($event)">
                        <span class="checkbox-custom"></span>
                        <span class="checkbox-text">Juego</span>
                        <span class="checkbox-count">65,222</span>
                    </label>
                </li>
                <li class="checkbox-item">
                    <label class="checkbox-label">
                        <input type="checkbox" class="checkbox-input" value="dlc" (change)="onTypeFilterChange($event)">
                        <span class="checkbox-custom"></span>
                        <span class="checkbox-text">DLC</span>
                        <span class="checkbox-count">16,289</span>
                    </label>
                </li>
                <li class="checkbox-item">
                    <label class="checkbox-label">
                        <input type="checkbox" class="checkbox-input" value="etarjetas" (change)="onTypeFilterChange($event)">
                        <span class="checkbox-custom"></span>
                        <span class="checkbox-text">eTarjetas</span>
                        <span class="checkbox-count">15,985</span>
                    </label>
                </li>
                <li class="checkbox-item">
                    <label class="checkbox-label">
                        <input type="checkbox" class="checkbox-input" value="tarjetas_regalo" (change)="onTypeFilterChange($event)">
                        <span class="checkbox-custom"></span>
                        <span class="checkbox-text">Tarjetas de regalo</span>
                        <span class="checkbox-count">2,821</span>
                    </label>
                </li>
                <li class="checkbox-item">
                    <label class="checkbox-label">
                        <input type="checkbox" class="checkbox-input" value="monedas_juegos" (change)="onTypeFilterChange($event)">
                        <span class="checkbox-custom"></span>
                        <span class="checkbox-text">Monedas de juegos</span>
                        <span class="checkbox-count">2,583</span>
                    </label>
                </li>
                <li class="checkbox-item">
                    <label class="checkbox-label">
                        <input type="checkbox" class="checkbox-input" value="software" (change)="onTypeFilterChange($event)">
                        <span class="checkbox-custom"></span>
                        <span class="checkbox-text">Software</span>
                        <span class="checkbox-count">1,530</span>
                    </label>
                </li>
            </ul>
            <button class="show-more">Mostrar más opciones</button>
        </div>
    </div>

    <!-- Sección de Plataformas -->
    <div class="filter-section">
        <button class="filter-button" (click)="toggleSection('platform')">
            <span>Plataformas</span>
            <div class="chevron" id="platform-chevron"></div>
        </button>
        <div class="filter-content" id="platform-content">
            <div class="search-box">
                <input type="text" class="search-input" placeholder="Buscar plataforma...">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
            </div>
            <ul class="checkbox-list">
                <li class="checkbox-item">
                    <label class="checkbox-label">
                        <input type="checkbox" class="checkbox-input" value="steam" (change)="onPlatformFilterChange($event)">
                        <span class="checkbox-custom"></span>
                        <span class="checkbox-text">Steam</span>
                        <span class="checkbox-count">42,227</span>
                    </label>
                </li>
                <li class="checkbox-item">
                    <label class="checkbox-label">
                        <input type="checkbox" class="checkbox-input" value="xbox_live" (change)="onPlatformFilterChange($event)">
                        <span class="checkbox-custom"></span>
                        <span class="checkbox-text">Xbox Live</span>
                        <span class="checkbox-count">32,662</span>
                    </label>
                </li>
                <li class="checkbox-item">
                    <label class="checkbox-label">
                        <input type="checkbox" class="checkbox-input" value="playstation" (change)="onPlatformFilterChange($event)">
                        <span class="checkbox-custom"></span>
                        <span class="checkbox-text">PlayStation</span>
                        <span class="checkbox-count">2,907</span>
                    </label>
                </li>
                <li class="checkbox-item">
                    <label class="checkbox-label">
                        <input type="checkbox" class="checkbox-input" value="nintendo" (change)="onPlatformFilterChange($event)">
                        <span class="checkbox-custom"></span>
                        <span class="checkbox-text">Nintendo</span>
                        <span class="checkbox-count">1,864</span>
                    </label>
                </li>
                <li class="checkbox-item">
                    <label class="checkbox-label">
                        <input type="checkbox" class="checkbox-input" value="epic_games" (change)="onPlatformFilterChange($event)">
                        <span class="checkbox-custom"></span>
                        <span class="checkbox-text">Epic Games</span>
                        <span class="checkbox-count">1,306</span>
                    </label>
                </li>
            </ul>
            <button class="show-more">Mostrar 92 más</button>
        </div>
    </div>

    <!-- Sección de Géneros -->
    <div class="filter-section">
        <button class="filter-button" (click)="toggleSection('genre')">
            <span>Géneros</span>
            <div class="chevron" id="genre-chevron"></div>
        </button>
        <div class="filter-content" id="genre-content">
            <div class="search-box">
                <input type="text" class="search-input" placeholder="Buscar género...">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
            </div>
            <ul class="checkbox-list">
                <li class="checkbox-item">
                    <label class="checkbox-label">
                        <input type="checkbox" class="checkbox-input" value="accion" (change)="onGenreFilterChange($event)">
                        <span class="checkbox-custom"></span>
                        <span class="checkbox-text">Acción</span>
                        <span class="checkbox-count">40,271</span>
                    </label>
                </li>
                <li class="checkbox-item">
                    <label class="checkbox-label">
                        <input type="checkbox" class="checkbox-input" value="aventura" (change)="onGenreFilterChange($event)">
                        <span class="checkbox-custom"></span>
                        <span class="checkbox-text">Aventura</span>
                        <span class="checkbox-count">30,606</span>
                    </label>
                </li>
                <li class="checkbox-item">
                    <label class="checkbox-label">
                        <input type="checkbox" class="checkbox-input" value="rpg" (change)="onGenreFilterChange($event)">
                        <span class="checkbox-custom"></span>
                        <span class="checkbox-text">RPG</span>
                        <span class="checkbox-count">13,703</span>
                    </label>
                </li>
                <li class="checkbox-item">
                    <label class="checkbox-label">
                        <input type="checkbox" class="checkbox-input" value="simulacion" (change)="onGenreFilterChange($event)">
                        <span class="checkbox-custom"></span>
                        <span class="checkbox-text">Simulación</span>
                        <span class="checkbox-count">13,833</span>
                    </label>
                </li>
                <li class="checkbox-item">
                    <label class="checkbox-label">
                        <input type="checkbox" class="checkbox-input" value="estrategia" (change)="onGenreFilterChange($event)">
                        <span class="checkbox-custom"></span>
                        <span class="checkbox-text">Estrategia</span>
                        <span class="checkbox-count">8,542</span>
                    </label>
                </li>
            </ul>
            <button class="show-more">Mostrar 24 más</button>
        </div>
    </div>
</aside>
